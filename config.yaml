# Central configuration for the YouTube Shorts agent.
# Prices are read from here (not hardcoded) so they can be updated as providers change.

channel:
  name: "Factodixs"
  handle: "@Factodixs"

posting:
  # 3/day is the practical ceiling: 1->2 nearly triples subscriber growth and
  # 2->3 still helps, but 4+ adds only ~8% while raising the risk of same-day
  # videos cannibalising each other. Slots live in the workflow cron.
  videos_per_day: 3
  visibility_on_launch: "public"

content:
  # THE NICHE. Every video must sit inside it.
  #
  # Videos used to be "any surprising fact", and reach flat-lined: 25 videos, max
  # 1373 views, median 906, none above 2000 - despite good retention (65% mean,
  # several above 95%). Retention that good with reach that capped means YouTube
  # never escalated past the seed audience. Its 2026 clustering routes new videos
  # to viewers who liked your PREVIOUS ones, so unrelated topics never compound -
  # each upload restarts cold. Space was chosen on this channel's own numbers:
  # 3 of the top 5 by views are space.
  niche: "space and astronomy"

  # Who the videos are for. Nothing in the pipeline defined this before, which is
  # why scripts had no consistent voice or assumed knowledge level.
  audience:
    persona: >
      Curious adults who like space but are not astronomers. They have seen the
      famous images and know the planet names; they have not read a paper. They
      watch Shorts in bed and while commuting.
    already_knows: >
      Planet names and order, that the Sun is a star, that space is big, that the
      Moon causes tides. Do not spend a shot explaining these.
    keeps_them_watching: >
      Scale that breaks intuition, things that sound false but are true, and being
      told that something they were taught is wrong. They will rewatch a number
      that shocked them.

  # Sub-niches, not separate topics: all four are space, so the audience cluster
  # still compounds, while the bandit in strategy.py retains something to learn
  # from. Each carries the FORMAT that already performed well in the old data.
  pillars:
    - id: planets_and_moons
      description: >
        Strange, concrete facts about specific bodies in our solar system - Venus,
        Saturn, Titan, Io, the Moon. Anchored to one named object per video.
      weight: 0.3
    - id: cosmic_scale
      description: >
        Distance, size and time comparisons that break intuition ('X could fit
        inside Y', 'light from Z left before W existed'). This format produced the
        channel's best retention - 101% and 95% - so lean on the comparison beat.
      weight: 0.3
    - id: space_myths
      description: >
        Widely believed space claims that are wrong, corrected in one fast beat
        (Great Wall from space, sound in space, the 'dark' side of the Moon).
        Disagreement drives comments, which is this channel's weakest signal.
      weight: 0.25
    - id: space_history
      description: >
        Missions, discoveries and near-disasters - Apollo, Voyager, Hubble, the
        probes still flying. Concrete human stories with a surprising detail.
      weight: 0.15

  # Recurring formats. Repetition is the point: viewers and the algorithm both
  # learn to recognise the channel. Recorded per video so the loop can score them.
  series:
    - id: how_big
      description: "Scale comparison - one object measured against a familiar one."
    - id: you_were_taught_wrong
      description: "A common belief stated, then corrected with the real answer."
    - id: out_there_right_now
      description: "Something happening in space at this moment, framed as present tense."

  avoid_topics:
    - medical advice
    - graphic violence
    - politics / elections
    - anything requiring on-screen real people/likenesses
    - astrology, UFO conspiracy, or anything not supported by mainstream astronomy
  hook_style: "Question or shocking claim in the first 1.5 seconds. No slow intros."
  # Comments are the weakest signal on the channel: 14 comments across 19,120
  # views (0.073%). A flat "follow for more" earns none, so every video now ends
  # on a real question the viewer can answer.
  cta: "End on a specific question the viewer can answer in one line."

  # The LLM tags each video with one of these, and the pipeline picks a music bed
  # from the matching assets/music/<mood>/ folder. Adding a mood here means adding
  # the folder too - an unmatched mood falls back to any available track.
  moods:
    - energetic     # surprising / impressive facts
    - mysterious    # unexplained / counter-intuitive
    - dramatic      # scale, danger, extremes
    - uplifting     # wholesome / positive payoffs

  # Length is deliberately varied so the analytics loop can learn which performs
  # better on THIS channel. Published benchmarks disagree: sub-30s Shorts get
  # 70-85% completion vs 50-65% for 30-60s, but longer Shorts have been shown to
  # earn more total views. Rather than guess, alternate and measure.
  length_variants:
    - name: short
      seconds: 30
      words: 85
      shots: 11
      weight: 0.5
    - name: long
      seconds: 50
      words: 140
      shots: 18
      weight: 0.5

budget:
  monthly_cap_usd: 50.0
  # Soft warning threshold - below this the pipeline runs normally.
  warn_threshold_usd: 35.0

providers:
  llm:
    provider: anthropic
    # Sonnet 5 rather than Haiku: viewers reported factually wrong claims, and the
    # web_search_20260209 tool used to verify them requires Sonnet 5 / Opus 4.6+.
    # Haiku can only use the older basic search variant.
    model: claude-sonnet-5
    max_tokens: 8000          # adaptive thinking is on by default and shares this budget
    search_tool_type: web_search_20260209
    max_searches_per_script: 6
    # Sonnet 5 tokens + up to 6 searches at ~$0.01 each.
    est_cost_per_script_usd: 0.09
  tts:
    provider: google_cloud_tts
    voice: "en-US-Neural2-D"
    est_cost_per_1k_chars_usd: 0.012
  # Free stock footage (no key = silently skipped, AI images used instead).
  # Real motion beats a panning still for retention, and costs nothing.
  stock_video:
    provider: pexels
    enabled: true
  image:
    provider: google_gemini_image
    model: gemini-2.5-flash-image   # "Nano Banana"; Imagen models are shut down as of Aug 17 2026
    est_cost_per_image_usd: 0.039
    # Hard cost ceiling per video. Fast cutting needs many shots but not many
    # distinct paid images - past this cap, shots reuse earlier visuals with a
    # different zoom direction, which reads as a new cut. Keeps spend bounded
    # even if stock footage is unavailable.
    max_per_video: 7

assembly:
  music_dir: "assets/music"
  # Music sits well under the voice; ducking (below) dips it further while the
  # narrator is actually speaking. Unverified until the first render with music -
  # no video has ever had a bed, so expect one tuning pass.
  music_volume_db: -20

  sfx_dir: "assets/sfx"
  hook_volume_db: -8          # should be clearly audible - it carries the hook
  transition_volume_db: -16   # should be felt more than heard
  max_transitions: 3          # a whoosh on every cut is noise, not a pattern interrupt

  # Sidechain ducking: the music dips automatically whenever the narrator speaks,
  # instead of being pinned at one compromise level for the whole video.
  ducking:
    enabled: true
    threshold: 0.05
    ratio: 8
    attack_ms: 20
    release_ms: 300
