name: Ideation Batch (Call A)

# Manual-only for now (see the plan's deviation #3: no schedule until one real
# batch has been run and inspected). Generates a batch of concepts into
# data/idea_bank.jsonl and files a GitHub issue listing everything awaiting
# human review via `python -m scripts.approve_ideas`.

on:
  workflow_dispatch:
    inputs:
      n:
        description: "Number of concepts to generate"
        type: string
        default: "40"

permissions:
  contents: write
  issues: write

concurrency:
  group: content-batches
  cancel-in-progress: false

jobs:
  ideate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run ideation batch
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python -m src.gen_ideas --n "${{ inputs.n }}"

      - name: Commit updated idea bank / spend ledger
        if: always()
        run: |
          git config user.name "youtube-agent-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/idea_bank.jsonl data/spend_ledger.json
          git diff --cached --quiet && echo "No data changes to commit" && exit 0
          git commit -m "Add ideation batch [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            echo "Push attempt $i failed; retrying."
            sleep 5
          done
          echo "::warning::Could not push data files after 3 attempts"

      - name: File gate-review issue
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const lines = fs.readFileSync('data/idea_bank.jsonl', 'utf8')
              .split('\n').filter(Boolean).map(JSON.parse);
            const pending = lines.filter(c => c.status === 'pending_review');
            if (pending.length === 0) {
              console.log('No pending_review concepts - nothing to file.');
              return;
            }
            const body = [
              `${pending.length} concept(s) awaiting review. Run `,
              '`python -m scripts.approve_ideas` locally, then commit and push',
              '`data/idea_bank.jsonl`.',
              '',
              ...pending.map(c =>
                `### ${c.id} — ${c.cluster}\n**${c.title}**\n- (a) ${c.hook_a}\n- (b) ${c.hook_b}\n`
              ),
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Ideation batch ready for review - ${new Date().toISOString().slice(0, 10)}`,
              body,
              labels: ['idea-gate'],
            });

      - name: Report failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Ideation batch failed - ${new Date().toISOString().slice(0, 10)}`,
              body: `The \`Ideation Batch\` workflow failed.\n\n**Run log:** ${url}`,
              labels: ['automation-failure'],
            });
