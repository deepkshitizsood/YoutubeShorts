name: Daily Spend Report

# Files a GitHub issue daily, which GitHub emails to the repo owner - the same
# notification path the weekly report and failure alerts already use, so no
# extra credentials are needed. Runs after the last daily_short.yml slot
# (23:00 UTC) so it reflects that day's full spend.
on:
  schedule:
    - cron: "30 23 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Build report
        run: python -m scripts.spend_report > report.md

      - name: File report as an issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('report.md', 'utf8');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Spend report - ${new Date().toISOString().slice(0, 10)}`,
              body,
              labels: ['spend-report'],
            });
