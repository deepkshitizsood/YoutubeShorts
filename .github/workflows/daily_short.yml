name: Daily YouTube Short

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Generate the video but skip upload"
        type: boolean
        default: true
  schedule:
    - cron: "0 23 * * *"   # ~4 PM Pacific (UTC offset drifts 1hr across DST changes - revisit if posting time matters precisely)

permissions:
  contents: write   # workflow commits updated data/*.json back to the repo
  issues: write     # failure notifications are filed as issues (see below)

# Serialize runs: multiple posts/day plus manual dispatches would otherwise race
# on the data/*.json commit and fail *after* already publishing to YouTube.
concurrency:
  group: daily-short
  cancel-in-progress: false

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg and caption font
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run daily pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
          GOOGLE_IMAGE_API_KEY: ${{ secrets.GOOGLE_IMAGE_API_KEY }}
          RUNWAY_API_KEY: ${{ secrets.RUNWAY_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python -m src.main --dry-run
          else
            python -m src.main
          fi

      - name: Upload generated video for inspection
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: dry-run-video
          path: output/**/final.mp4
          retention-days: 7

      # always(): a failed pipeline still spent money and may have written state,
      # so the ledger/history must be persisted rather than discarded.
      - name: Commit updated data files
        if: always()
        run: |
          git config user.name "youtube-agent-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/*.json
          git diff --cached --quiet && echo "No data changes to commit" && exit 0
          git commit -m "Update performance log / spend ledger [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            echo "Push attempt $i failed; retrying."
            sleep 5
          done
          echo "::warning::Could not push data files after 3 attempts"

      - name: Report failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Daily Short run failed - ${new Date().toISOString().slice(0, 10)}`,
              body: [
                `The \`Daily YouTube Short\` workflow failed, so no video was published for this slot.`,
                ``,
                `**Run log:** ${url}`,
                ``,
                `Common causes: a transient provider 5xx (now retried automatically),`,
                `an expired \`YOUTUBE_REFRESH_TOKEN\` (regenerate + update the secret),`,
                `or exhausted API credits.`,
              ].join('\n'),
              labels: ['automation-failure'],
            });
