name: Scripting Batch (Call B)

# Manual-only for now (see the plan's deviation #3: no schedule until one real
# batch has been run and inspected). Turns approved idea_bank.jsonl concepts
# into finished scripts + shot lists in data/script_queue.json. No-ops
# cleanly if there are zero approved concepts.

on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: content-batches
  cancel-in-progress: false

jobs:
  script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run scripting batch
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m src.gen_scripts

      - name: Commit updated script queue / idea bank / spend ledger
        if: always()
        run: |
          git config user.name "youtube-agent-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/script_queue.json data/idea_bank.jsonl data/spend_ledger.json
          git diff --cached --quiet && echo "No data changes to commit" && exit 0
          git commit -m "Add scripting batch [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            echo "Push attempt $i failed; retrying."
            sleep 5
          done
          echo "::warning::Could not push data files after 3 attempts"

      - name: Report failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Scripting batch failed - ${new Date().toISOString().slice(0, 10)}`,
              body: `The \`Scripting Batch\` workflow failed.\n\n**Run log:** ${url}`,
              labels: ['automation-failure'],
            });
